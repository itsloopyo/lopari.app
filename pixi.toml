[workspace]
name = "lopari.app"
description = "Marketing site for Lopari"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
# `node` runs scripts/update-metadata.mjs and scripts/update-latest.mjs.
# `gh` is the GitHub CLI - update-metadata.mjs falls back to `gh auth token`
# when $GITHUB_TOKEN isn't set, which is the path most devs hit.
nodejs = ">=20"
gh = ">=2.40"

[tasks.dev]
cmd = "python -c \"import webbrowser, threading, http.server, socketserver; port=4173; threading.Timer(0.6, lambda: webbrowser.open(f'http://localhost:{port}/')).start(); socketserver.TCPServer(('127.0.0.1', port), http.server.SimpleHTTPRequestHandler).serve_forever()\""
description = "Serve lopari.app at http://localhost:4173 and open it in the default browser"

# Republish ../lopari/catalog/mods.json to mods.json with release, dev-build,
# and launcher-update pins stamped in. The launcher reads mods.json as its
# only source of build availability - it never queries the GitHub API - so
# run this whenever a mod ships a release or dev build. Both copies are
# committed for you (see scripts/commit-catalog.mjs); pushing them stays
# manual. Authenticates via $GITHUB_TOKEN or `gh auth token`.
[tasks.update-metadata]
cmd = "node scripts/update-metadata.mjs && node scripts/commit-catalog.mjs"
description = "Republish and commit mods.json with pinned release / dev-build / launcher info for every public mod in the lopari catalog"

# Pins-only refresh of the LIVE mods.json (this repo, in and out) - no
# ../lopari checkout needed, so CI can run it. update-pins.yml calls this
# on repository/workflow dispatch from mod releases and on an hourly
# schedule; the full update-metadata stays the local path for authored
# catalog changes.
[tasks.update-pins]
cmd = "node scripts/update-metadata.mjs --live"
description = "Refresh release/dev/launcher pins in the live mods.json only (CI-safe)"
